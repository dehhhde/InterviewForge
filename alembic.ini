# Alembic configuration [stage 3 / M3]
#
# THIS FILE MUST STAY ASCII-ONLY. alembic reads it through
# `ConfigParser.read(..., encoding="locale")`, and the locale on this machine is GBK,
# so Chinese comments here raise a UnicodeDecodeError before any migration runs.
# (Measured 2026-10-16; the prose for these decisions lives in migrations/env.py.)
#
# Two rules:
# 1. No connection string here. `sqlalchemy.url` stays empty; migrations/env.py resolves
#    it from ALEMBIC_DATABASE_URL or get_settings().database_url. This file is committed,
#    so a URL in it means the database location (and eventually a password) is public.
# 2. Keep `prepend_sys_path = .` -- env.py imports `app.*`, and without this line alembic
#    fails with ModuleNotFoundError whenever it is invoked from another working directory.

[alembic]
# POSIX-style path, relative to %(here)s (the directory holding this ini file).
script_location = %(here)s/migrations

# Revision filenames keep alembic's default `<rev>_<slug>`. Date prefixes are the usual
# source of "two files, same version id" collisions when work is done in parallel.
# file_template =

prepend_sys_path = .

path_separator = os

# Intentionally empty. See rule 1 above.
sqlalchemy.url =


[post_write_hooks]
# Auto-format generated revisions with the repo's own ruff config (line-length=100,
# East-Asian width), so nothing has to be duplicated here.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Consumed only by fileConfig() in migrations/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
